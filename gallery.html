<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Gallery | IGCCST 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body class="paper-bg">

    <!-- Sticky Header Wrapper Minimal Replication -->
    <header class="site-header scrolled">
        <div class="container nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-accent">IGCCST</span><span class="brand-year">2026</span>
            </a>
            <nav class="desktop-nav">
                <a href="index.html">← Back to Main Page</a>
                <a href="index.html#registration" class="nav-cta"><span>Register Free</span></a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 60px; padding-bottom: 100px;">
        
        <!-- Gallery Full View Intro Header -->
        <div class="section-intro section-intro-wide reveal is-visible" style="margin-bottom: 50px;">
            <div class="section-number">INDEX</div>
            <div>
                <span class="eyebrow">Extended Archives</span>
                <h2><span>Media</span> Gallery Hub</h2>
                <p class="section-subtitle">Comprehensive photo logs of technical tracking blocks, scientific keynotes, panel interactions, and campus moments across IIT Kharagpur.</p>
            </div>
        </div>

        <!-- Expanded Full Gallery Display Grid Layout Matrix -->
        <div class="gallery-preview-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
            
            <!-- Gallery Item Blocks (Replicate out for your files) -->
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img1.jpg" alt="Gallery Track Item"></div>
            </div>
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img2.jpg" alt="Gallery Track Item"></div>
            </div>
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img3.jpg" alt="Gallery Track Item"></div>
            </div>
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img4.jpg" alt="Gallery Track Item"></div>
            </div>
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img5.jpg" alt="Gallery Track Item"></div>
            </div>
            <div class="gallery-item reveal is-visible">
                <div class="gallery-image-wrap"><img src="images/gallery/img6.jpg" alt="Gallery Track Item"></div>
            </div>

        </div>
    </main>

    <script src="interaction.js"></script>
</body>
</html>
